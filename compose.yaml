services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: resourceos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: resourceos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - resourceos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resourceos -d resourceos"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  resourceos_pg:
